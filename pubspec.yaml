name: libtailcat
description: >-
  Dart bindings for Tailcat: WireGuard-encrypted point-to-point TCP and UDP
  tunnels over Tailscale's relays and NAT traversal, as dart:io sockets.
version: 1.0.1
repository: https://github.com/velzosoft/libtailcat
issue_tracker: https://github.com/velzosoft/libtailcat/issues
topics:
  - tailcat
  - tailscale
  - ffi
  - networking
  - wireguard

environment:
  sdk: ^3.10.0

platforms:
  android:
  ios:
  linux:
  macos:
  windows:

dependencies:
  code_assets: ^2.2.0
  crypto: ^3.0.7
  ffi: ^2.2.0
  hooks: ^2.2.0
  meta: ^1.16.0

dev_dependencies:
  async: ^2.13.0
  lints: ^6.1.0
  shelf: ^1.4.2
  test: ^1.31.2

# Only apply while libtailcat is the root package (its own development).
hooks:
  user_defines:
    libtailcat:
      # Unit tests run without Go or a prebuilt library.
      allow_missing_native: true
      # Git-ignored developer overrides.
      local_config: hook/local_config.json
