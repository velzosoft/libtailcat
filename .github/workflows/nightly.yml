name: Nightly

# What hermetic CI can't see. A failure here is a heads-up, not a broken main.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  # The public relays are rate limited, so only this job uses them.
  public-relays:
    name: Public relays
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - id: pin
        run: |
          echo "go=$(sed -n 's/^go: //p' native/UPSTREAM)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.pin.outputs.go }}
      - run: dart pub get
      - run: |
          echo '{"native": "source"}' > hook/local_config.json
      - run: dart test --run-skipped -t network --reporter expanded

  # New SDKs can add members to the dart:io classes implemented here.
  dart-beta:
    name: Dart beta
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: beta
      - id: pin
        run: |
          echo "go=$(sed -n 's/^go: //p' native/UPSTREAM)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.pin.outputs.go }}
      - run: dart pub get
      - run: dart analyze --fatal-warnings
      - run: |
          echo '{"native": "source"}' > hook/local_config.json
      - run: dart test --reporter expanded

  # Early warning of C ABI changes on upstream main.
  upstream-main:
    name: Upstream main
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tailscale/tailcat
          path: upstream-main
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - uses: actions/setup-go@v5
        with:
          go-version-file: upstream-main/go.mod
      - run: dart pub get
      - name: The vendored header still matches
        run: diff -u native/tailcat.h upstream-main/cmd/libtailcat/tailcat.h
        continue-on-error: true
      - run: |
          echo '{"native": "source", "source_dir": "../upstream-main", "go_toolchain": "local"}' > hook/local_config.json
      - run: dart test --reporter expanded
